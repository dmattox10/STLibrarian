# Everything a release consists of, built by machine.
#
# Triggered by a tag:  git tag v0.2.0 && git push origin v0.2.0
#
# The point of this file is that the server stops being a thing people compile.
# A NAS owner should download a binary or pull an image, exactly as a desktop
# user downloads a bundle -- and that only happens if something builds those
# artefacts on every release without being asked.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write     # create the GitHub Release and attach files
  packages: write     # push the container image to ghcr.io

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------ desktop
  desktop:
    name: desktop (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,  label: macos-arm64,   args: "--target aarch64-apple-darwin" }
          - { os: macos-latest,  label: macos-x86_64,  args: "--target x86_64-apple-darwin" }
          - { os: ubuntu-22.04,  label: linux-x86_64,  args: "" }
          - { os: windows-latest, label: windows-x86_64, args: "" }
    defaults:
      run:
        working-directory: stlibrarian
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: stlibrarian/yarn.lock

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.label == 'macos-arm64' && 'aarch64-apple-darwin' || matrix.label == 'macos-x86_64' && 'x86_64-apple-darwin' || '' }}

      # Tauri on Linux links GTK and webkit2gtk. Ubuntu 22.04 rather than
      # latest: the bundle is only installable on distributions whose glibc is
      # at least as new as the one it was built against.
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev

      - run: yarn install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set these two once you have run `yarn tauri signer generate`, and
          # the built bundles gain .sig files the updater can verify.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: stlibrarian
          tagName: ${{ github.ref_name }}
          releaseName: STLibrarian ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # ------------------------------------------------------------ server binary
  server:
    name: server (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  suffix: linux-x86_64 }
          - { target: aarch64-unknown-linux-gnu, suffix: linux-aarch64 }
    defaults:
      run:
        working-directory: stlibrarian
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: stlibrarian/yarn.lock

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # rusqlite is compiled from source (`bundled`), so cross-compiling needs
      # a cross C compiler -- not just a Rust target.
      - name: Cross compiler for aarch64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
          } >> "$GITHUB_ENV"

      - name: Build the web front end
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Build the server
        run: |
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml \
            --target ${{ matrix.target }} \
            --no-default-features --features server --bin stlibrarian-server

      - name: Collect
        run: |
          mkdir -p out
          # One artefact per architecture. The web UI is compiled into it, so
          # there is nothing to publish beside it.
          cp src-tauri/target/${{ matrix.target }}/release/stlibrarian-server \
             out/stlibrarian-server-${{ matrix.suffix }}
          ( cd out && sha256sum -- * > SHA256SUMS-${{ matrix.suffix }} )

      - uses: softprops/action-gh-release@v2
        with:
          files: stlibrarian/out/*
          draft: true
          tag_name: ${{ github.ref_name }}

  # ------------------------------------------------------------------- image
  image:
    name: container image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/stlibrarian
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # arm64 matters: a good share of NAS boxes are arm, and an amd64-only
      # image fails for them at `docker compose up` with an exec format error.
      - uses: docker/build-push-action@v6
        with:
          context: stlibrarian
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
