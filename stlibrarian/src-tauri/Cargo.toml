[package]
name = "stlibrarian"
version = "0.1.0"
description = "Local-first 3D model library that scales to a multi-user NAS"
authors = ["Dan Mattox"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stlibrarian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Two front doors onto one core.
#
# The desktop bin links Tauri, which on Linux drags in GTK and webkit2gtk. A NAS
# is headless and has neither, so the server bin must be buildable without any
# of it -- hence the feature split rather than one binary with a flag.
#
#   cargo build --bin stlibrarian                                        # desktop
#   cargo build --no-default-features --features server --bin stlibrarian-server
[[bin]]
name = "stlibrarian"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "stlibrarian-server"
path = "src/server/main.rs"
required-features = ["server"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-plugin-dialog"]
server = ["dep:axum", "dep:tokio", "dep:tower-http", "dep:tokio-util"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- shared core ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `bundled` compiles SQLite in. Without it the NAS build depends on whatever
# libsqlite3 the host happens to ship, which is exactly the surprise you do not
# want on someone else's Synology.
rusqlite = { version = "0.37.0", features = ["bundled"] }
sha2 = "0.10.9"
log = "0.4.29"
env_logger = "0.11"
walkdir = "2"
dirs = "5"
argon2 = "0.5"
# Must match the rand_core that password-hash uses, with getrandom on, or
# `OsRng` is compiled out and salts have no entropy source.
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"

# --- desktop only ---
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }

# --- server only ---
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs"], optional = true }
tower-http = { version = "0.6", features = ["cors", "fs"], optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
