# A download host for STLibrarian builds.
#
# Static files and nothing else: no application, no database, no state. It
# exists so that "download the app" and "the app updates itself" both point at
# a URL you control rather than at a build machine or a share.
#
# Mounted into an nginx container as /etc/nginx/conf.d/default.conf, with the
# release directory at /srv/releases. TLS is terminated by the reverse proxy in
# front of it, so there is no ssl_ here.

server {
    listen 80;
    server_name _;

    root /srv/releases;

    # Installers are tens to hundreds of megabytes. sendfile hands them to the
    # kernel rather than copying through nginx, and the larger output buffers
    # keep a slow client from turning into a busy loop.
    sendfile on;
    tcp_nopush on;
    output_buffers 4 256k;

    # Ranged requests, so an interrupted download resumes instead of starting
    # over. The desktop updater relies on this over a bad connection.
    max_ranges 1;

    # Nothing here is secret, and the updater in the app is not a browser
    # sending an Origin. The header is for the marketing page, which fetches
    # latest.json to show a version number.
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;

    # --- what the updater reads ------------------------------------------
    #
    # Never cached. It is small, it is read once per update check, and a stale
    # copy in a CDN or a corporate proxy means a release that silently does
    # not exist for some of your users.
    location = /latest.json {
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        default_type application/json;
    }

    # --- the builds themselves --------------------------------------------
    #
    # Every path under /releases contains a version, so a given URL's bytes
    # never change. Cache them for a year and let the version be the cache key.
    location /releases/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        # Browsers must download these, not try to display them. Types nginx
        # does not know default to application/octet-stream, which is what an
        # installer wants anyway; these are the ones it guesses wrong.
        types {
            application/octet-stream AppImage;
            application/octet-stream dmg;
            application/octet-stream msi;
            application/octet-stream exe;
            application/vnd.debian.binary-package deb;
            application/x-rpm rpm;
            application/gzip gz;
            application/zip zip;
            text/plain sig;
            application/json json;
            text/plain txt;
            text/plain sha256;
        }
    }

    # A convenience alias so a download button can be written once and keep
    # working across releases: /latest/stlibrarian-server-linux-x86_64
    location /latest/ {
        # Rewritten by publish-release.sh, which repoints this symlink after a
        # successful upload. A symlink rather than a redirect so that resuming
        # a partial download cannot land on a different release mid-file.
        alias /srv/releases/latest/;
        add_header Cache-Control "no-store" always;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    # Directory listing at the root is a feature here: it is how you check what
    # actually got published.
    location / {
        autoindex on;
        autoindex_exact_size off;
    }

    location ~ /\. { deny all; }
}
