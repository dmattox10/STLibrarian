# Add this service to the docker-compose.yml on your box, alongside whatever
# else it already runs, then point a proxy host at `stlibrarian-dl:80`.
#
# It joins the same external network the reverse proxy uses, so it needs no
# published port: nothing reaches it except through the proxy, which is what
# gives it TLS and a certificate.
services:
  stlibrarian-dl:
    image: nginx:alpine
    container_name: stlibrarian-dl
    restart: unless-stopped
    volumes:
      # Where publish-release.sh uploads to. Read-only here: this container
      # serves the files, it never writes them.
      - ./stlibrarian-releases:/srv/releases:ro
      - ./stlibrarian-releases-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxiable
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 60s
      timeout: 5s
      retries: 3

networks:
  proxiable:
    external: true
    name: proxiable
